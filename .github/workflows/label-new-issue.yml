name: Label New issues

on:
  issues:
    types: [opened]

jobs:
  label-issues:
    runs-on: ubuntu-latest
    permissions: 
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Add triage label
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
